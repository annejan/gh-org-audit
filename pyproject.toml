[project]
name = "gh-org-audit"
version = "0.1.0"
description = "Dump GitHub organisation authorisations (repos, teams, CODEOWNERS) to an Excel workbook"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Anne Jan Brouwer" }]
dependencies = ["requests>=2.28", "openpyxl>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "reuse>=4"]

[project.scripts]
gh-org-audit = "gh_org_audit:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["gh_org_audit"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
